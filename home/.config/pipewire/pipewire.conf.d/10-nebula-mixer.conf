# ─────────────────────────────────────────────────────────────
#  10-nebula-mixer.conf — PipeWire equivalent of the Voicemeeter setup
#
#  Voicemeeter                         →  PipeWire
#  Strip 1 "MIC" → B1                  →  "Microphone (Nebula)" virtual source
#    gain +5 dB, color panel tweak        noise suppression, high-pass, EQ, gain
#  Strip 2 "musique" (VB-Cable) → A1   →  "Music" virtual sink → headset
#  Virtual inputs (system sound) → A1  →  default PipeWire behavior
#
#  Both devices follow the default input / output, so the same file works
#  on every machine. Pick the headset as default device (Serpantinum or
#  pavucontrol), send the music app to "Music", and select
#  "Microphone (Nebula)" as the microphone in Discord / games.
#
#  Requires: noise-suppression-for-voice (RNNoise LADSPA plugin)
#  Apply:    systemctl --user restart pipewire pipewire-pulse wireplumber
# ─────────────────────────────────────────────────────────────

context.modules = [
    # "Music": separate volume for music, never sent to the microphone
    {   name  = libpipewire-module-loopback
        flags = [ nofail ]
        args = {
            node.description = "Music"
            capture.props = {
                node.name      = "nebula_music"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "nebula_music.output"
                node.passive   = true
                audio.position = [ FL FR ]
            }
        }
    }

    # "Microphone (Nebula)": cleaner and louder microphone
    #   1. RNNoise      removes background noise (keyboard, fans, breathing)
    #   2. high-pass    cuts rumble below 80 Hz (desk bumps, handling noise)
    #   3. low shelf    +1.5 dB under 200 Hz: a bit of warmth
    #   4. high shelf   +2.5 dB above 4.5 kHz: clarity / "brightness"
    #   5. gain         +5 dB (Voicemeeter strip gain 5.03 dB → ×1.785)
    # Steps 3–4 approximate Voicemeeter's color panel (slightly "Lo",
    # brightness up); tune the Gain values to taste.
    {   name  = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Microphone (Nebula)"
            media.name       = "Microphone (Nebula)"
            filter.graph = {
                nodes = [
                    {   type    = ladspa
                        name    = rnnoise
                        plugin  = /usr/lib/ladspa/librnnoise_ladspa.so
                        label   = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"          = 50.0
                            "VAD Grace Period (ms)"      = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                    {   type    = builtin
                        name    = highpass
                        label   = bq_highpass
                        control = { "Freq" = 80.0 "Q" = 0.707 }
                    }
                    {   type    = builtin
                        name    = warmth
                        label   = bq_lowshelf
                        control = { "Freq" = 200.0 "Q" = 0.707 "Gain" = 1.5 }
                    }
                    {   type    = builtin
                        name    = clarity
                        label   = bq_highshelf
                        control = { "Freq" = 4500.0 "Q" = 0.707 "Gain" = 2.5 }
                    }
                    {   type    = builtin
                        name    = gain
                        label   = mixer
                        control = { "Gain 1" = 1.785 }
                    }
                ]
                links = [
                    { output = "rnnoise:Output"  input = "highpass:In" }
                    { output = "highpass:Out"    input = "warmth:In" }
                    { output = "warmth:Out"      input = "clarity:In" }
                    { output = "clarity:Out"     input = "gain:In 1" }
                ]
                inputs  = [ "rnnoise:Input" ]
                outputs = [ "gain:Out" ]
            }
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name    = "nebula_mic.input"
                node.passive = true
            }
            playback.props = {
                node.name   = "nebula_mic"
                media.class = "Audio/Source"
            }
        }
    }
]
