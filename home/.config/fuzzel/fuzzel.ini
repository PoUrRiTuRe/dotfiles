# fuzzel — Nebula theme (used by the SUPER + K shortcut menu)
# Font size and number of lines are set by ~/.local/bin/keybinds-menu from the
# height of the focused monitor, so the menu fits 1080p and 1440p alike.
[main]
font=JetBrainsMono Nerd Font:size=11
prompt="  "
placeholder=Search a shortcut… (keys, app, action)
icons-enabled=no
anchor=center
width=84
lines=15
horizontal-pad=20
vertical-pad=14
inner-pad=8
dpi-aware=no
layer=overlay

[colors]
background=0b0d1cf0
text=c9d1e6ff
prompt=00f0ffff
placeholder=6b7394ff
input=ffffffff
match=00f0ffff
selection=e600ffff
selection-text=0b0d1cff
selection-match=0b0d1cff
border=00f0ffaa

[border]
width=2
radius=16
