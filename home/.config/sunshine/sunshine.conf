# Sunshine — stream the TABLET virtual monitor to Moonlight (docs/tablet-screen.md)
# wlr capture: the only one that sees Hyprland's headless (virtual) outputs
capture = wlr
# AMD GPU: hardware encoding through VA-API
encoder = vaapi
# Monitor to stream: its number in Sunshine's log ("[wlgrab] Monitor N is TABLET"),
# 2 on the desktop (DP-3 = 0, HDMI-A-1 = 1, TABLET = 2 once tablet-screen on runs)
output_name = 2
