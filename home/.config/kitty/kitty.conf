font_family      JetBrainsMono Nerd Font
font_size        16.0
bold_font        auto
italic_font      auto
bold_italic_font auto

cursor_trail 1

background_opacity 0.75
confirm_os_window_close 0

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no
hide_window_decorations yes

window_padding_width 4

# Allow "kitty @" from kitty windows (used to save the scrollback before clear)
allow_remote_control yes

include ~/.config/kitty/colors.conf

# Mouse selection: cyan text on a medium blue
# (same colors as zle_highlight in .zshrc for keyboard selection)
# Placed after the include so it overrides the theme colors.
selection_foreground #00e5ff
selection_background #2b3d8f

# Copy the whole terminal scrollback
map ctrl+alt+c launch --stdin-source=@screen_scrollback --type=background wl-copy

# Copy only the output of the last command
map ctrl+alt+x launch --stdin-source=@last_cmd_output --type=background wl-copy

# Text zoom (current window)
map ctrl+equal       change_font_size current +1.0
map ctrl+plus        change_font_size current +1.0
map ctrl+kp_add      change_font_size current +1.0
map ctrl+minus       change_font_size current -1.0
map ctrl+kp_subtract change_font_size current -1.0
map ctrl+0           change_font_size current 0

# Leave Ctrl + Shift + ←/→ to zsh (word-by-word selection)
# instead of switching kitty tabs
map ctrl+shift+left  no_op
map ctrl+shift+right no_op
