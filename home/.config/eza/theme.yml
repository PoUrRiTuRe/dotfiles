# ─────────────────────────────────────────────────────────────
#  ~/.config/eza/theme.yml — "Nebula" theme for eza
#  One color per file type, matching the cyan / magenta rice
# ─────────────────────────────────────────────────────────────

# Item types
filekinds:
  normal:       { foreground: "#FFFFFF" }                 # regular file: white
  directory:    { foreground: "#00E5FF", is_bold: true }  # directory: cyan
  symlink:      { foreground: "#FF2BD6" }                 # link: magenta
  executable:   { foreground: "#39FF88", is_bold: true }  # script / program: neon green
  pipe:         { foreground: "#FFC83C" }
  socket:       { foreground: "#FFC83C" }
  block_device: { foreground: "#FF9E3D" }
  char_device:  { foreground: "#FF9E3D" }
  special:      { foreground: "#FF9E3D" }
  mount_point:  { foreground: "#00E5FF", is_underline: true }

# File types (from the extension)
file_type:
  image:      { foreground: "#FF9E3D" }   # .png .jpg .gif…: orange
  video:      { foreground: "#FF5C8A" }   # .mp4 .mkv…: pink
  music:      { foreground: "#B8A8FF" }   # .mp3 .ogg…: lavender
  lossless:   { foreground: "#B8A8FF", is_bold: true }  # .flac…: bold lavender
  document:   { foreground: "#FFE66D" }   # .pdf .docx .md…: yellow
  compressed: { foreground: "#FF3860" }   # .zip .tar.gz…: red
  source:     { foreground: "#7DF9FF" }   # .java .py .lua…: light cyan
  build:      { foreground: "#FFE66D", is_underline: true }  # Makefile, pom.xml…
  compiled:   { foreground: "#8F86B8" }   # .class .o…: greyish purple
  crypto:     { foreground: "#39FF88" }   # keys, .gpg…: green
  temp:       { foreground: "#6F6A8F" }   # temporary files: purple grey

# Date column (ls -l)
date: { foreground: "#B8A8FF" }
