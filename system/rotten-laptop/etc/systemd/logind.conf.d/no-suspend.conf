[Login]
# On battery: suspend (Hyprland locks right before)
HandleLidSwitch=suspend
# On AC: nothing system-side, Hyprland handles locking
HandleLidSwitchExternalPower=ignore
# With an external monitor plugged in: do nothing
HandleLidSwitchDocked=ignore
# Sleep key (Fn + 4) ignored: no more accidental suspend
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
