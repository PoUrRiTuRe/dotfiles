[Login]
# Sur batterie : veille (Hyprland verrouille juste avant)
HandleLidSwitch=suspend
# Sur secteur : rien côté système, Hyprland s'occupe du verrouillage
HandleLidSwitchExternalPower=ignore
# Avec un écran externe branché : ne rien faire
HandleLidSwitchDocked=ignore
# Touche de veille (Fn + 4) ignorée : plus de veille par accident
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
