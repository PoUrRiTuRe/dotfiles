<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="JetBrains Mono, DejaVu Sans Mono, monospace">
  <defs>
    <radialGradient id="g1" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#e600ff" stop-opacity=".22"/><stop offset="1" stop-color="#e600ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0%" cy="100%" r="70%"><stop offset="0" stop-color="#00f0ff" stop-opacity=".18"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#e600ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00f0ff"/></marker>
  </defs>
  <rect width="960" height="540" fill="#070914"/>
  <rect width="960" height="540" fill="url(#g1)"/>
  <rect width="960" height="540" fill="url(#g2)"/>
  <circle cx="58" cy="52" r="26" fill="none" stroke="#e600ff" stroke-width="2.5"/>
  <text x="58" y="61" text-anchor="middle" font-size="26" font-weight="700" fill="#e600ff">4</text>
  <text x="100" y="62" font-size="27" font-weight="700" fill="url(#title)" letter-spacing="2">FLASH, IN THIS ORDER</text>
  <g><rect x="80" y="130" width="800" height="62" rx="12" fill="#12162e" stroke="#e600ff" stroke-opacity=".6"/><text x="105" y="169" font-size="22" fill="#e600ff" text-anchor="start">1</text><text x="140" y="158" font-size="18" fill="#00f0ff" text-anchor="start">settings_reset.uf2</text><text x="140" y="180" font-size="14" fill="#7d86a8" text-anchor="start">erases the old pairings</text><text x="860" y="169" font-size="16" fill="#d6def5" text-anchor="end">dongle, left, right</text><rect x="80" y="208" width="800" height="62" rx="12" fill="#12162e" stroke="#00f0ff" stroke-opacity=".6"/><text x="105" y="247" font-size="22" fill="#e600ff" text-anchor="start">2</text><text x="140" y="236" font-size="18" fill="#00f0ff" text-anchor="start">dongle.uf2</text><text x="140" y="258" font-size="14" fill="#7d86a8" text-anchor="start">the new central</text><text x="860" y="247" font-size="16" fill="#d6def5" text-anchor="end">dongle</text><rect x="80" y="286" width="800" height="62" rx="12" fill="#12162e" stroke="#00f0ff" stroke-opacity=".6"/><text x="105" y="325" font-size="22" fill="#e600ff" text-anchor="start">3</text><text x="140" y="314" font-size="18" fill="#00f0ff" text-anchor="start">lily58_left.uf2</text><text x="140" y="336" font-size="14" fill="#7d86a8" text-anchor="start">now a peripheral</text><text x="860" y="325" font-size="16" fill="#d6def5" text-anchor="end">left half</text><rect x="80" y="364" width="800" height="62" rx="12" fill="#12162e" stroke="#00f0ff" stroke-opacity=".6"/><text x="105" y="403" font-size="22" fill="#e600ff" text-anchor="start">4</text><text x="140" y="392" font-size="18" fill="#00f0ff" text-anchor="start">lily58_right.uf2</text><text x="140" y="414" font-size="14" fill="#7d86a8" text-anchor="start">now a peripheral</text><text x="860" y="403" font-size="16" fill="#d6def5" text-anchor="end">right half</text></g>
  <rect x="40" y="462" width="880" height="50" rx="12" fill="#12162e" stroke="#00f0ff" stroke-opacity=".35"/>
  <text x="480.0" y="494" text-anchor="middle" font-size="17" fill="#d6def5">Drag each .uf2 onto the board's USB drive: it reboots by itself when the copy ends</text>
